services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - crm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - crm-redis-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: crm-api
    restart: unless-stopped
    networks: [default, proxy]
    # Imágenes, audios y documentos de WhatsApp (y grabaciones de llamadas):
    # en un volumen, o se pierden con cada despliegue.
    volumes:
      - crm-media:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      API_PORT: 3001
      MEDIA_DIR: /data/media
      # ── Multi-empresa ──────────────────────────────────────
      # "single" (por defecto) = una sola empresa, como siempre.
      # "multi" = SaaS: cada empresa en su subdominio de SAAS_BASE_DOMAIN.
      TENANCY_MODE: ${TENANCY_MODE:-single}
      SAAS_BASE_DOMAIN: ${SAAS_BASE_DOMAIN:-}
      RESERVED_SUBDOMAINS_EXTRA: ${RESERVED_SUBDOMAINS_EXTRA:-}
      # Cuenta maestra de la plataforma (admin.<dominio>). Sin estas dos, la
      # consola no deja entrar a nadie.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD_HASH: ${PLATFORM_ADMIN_PASSWORD_HASH:-}
      # SaaS: prestar las claves de IA de la plataforma a las empresas.
      AI_SHARED_KEYS: ${AI_SHARED_KEYS:-}
      # SaaS: IA de Driony con cupo por plan para empresas sin clave propia
      # (usa OPENAI_API_KEY). "false" o vacío la apaga al instante.
      AI_INCLUDED: ${AI_INCLUDED:-}
      AI_INCLUDED_MODEL: ${AI_INCLUDED_MODEL:-}
      # SaaS: "true" cuando Meta apruebe a la plataforma como proveedor
      # tecnológico; hasta entonces las empresas ven un aviso en WhatsApp.
      WHATSAPP_TECH_PROVIDER_APPROVED: ${WHATSAPP_TECH_PROVIDER_APPROVED:-}
      # Dirección pública de la API, si no es https://api.<SAAS_BASE_DOMAIN>.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # Correo al que escriben para cambiar de plan (Ajustes › Plan).
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
      # Row-Level Security. Solo sirve si DATABASE_URL apunta a un rol que NO
      # sea dueño de las tablas (ver scripts/create-app-role.sql).
      DB_RLS: ${DB_RLS:-}
      WEB_ORIGIN: ${WEB_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      WHATSAPP_APP_ID: ${WHATSAPP_APP_ID}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v24.0}
      # Credenciales del admin inicial (las usa el seed).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@crm.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
      # Token del webhook de leads entrantes.
      LEAD_WEBHOOK_TOKEN: ${LEAD_WEBHOOK_TOKEN}
    # Sin "ports": el proxy lo alcanza por la red "proxy" como crm-api:3001.
    #
    # OJO: la API NO es interna. Tiene que ser accesible desde fuera, porque
    # el navegador se conecta a ella directamente para el WebSocket de la
    # bandeja, y Meta le manda el webhook de WhatsApp. En el proxy va bajo su
    # propio subdominio (api.tudominio) — ver deploy/nginx/driony.conf.
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WHATSAPP_APP_ID: ${NEXT_PUBLIC_WHATSAPP_APP_ID}
        NEXT_PUBLIC_WHATSAPP_CONFIG_ID: ${NEXT_PUBLIC_WHATSAPP_CONFIG_ID}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-Driony}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL}
    container_name: crm-web
    restart: unless-stopped
    networks: [default, proxy]
    depends_on:
      - api
    environment:
      # API_URL interno (servidor → api container, no sale a internet)
      API_URL: http://api:3001
      AUTH_SECRET: ${AUTH_SECRET}
      # Solo para instalaciones de UNA empresa. Con SAAS_BASE_DOMAIN debe ir
      # vacío: cada subdominio es su propio origen de autenticación.
      AUTH_URL: ${AUTH_URL:-}
      # El middleware lo lee en cada petición para sacar el subdominio. Es de
      # ejecución y no de build a propósito: cambiar de dominio es reiniciar,
      # no reconstruir la imagen.
      SAAS_BASE_DOMAIN: ${SAAS_BASE_DOMAIN:-}
      HOSTNAME: "0.0.0.0"
    # Sin "ports": NPM lo alcanza por la red "proxy" como crm-web:3000.
    expose:
      - "3000"

networks:
  # Red interna del CRM (db, redis, api, web se ven entre sí).
  default:
  # Red compartida con Nginx Proxy Manager. Pon aquí el nombre EXACTO de la red
  # de tu NPM (docker network ls). Por defecto suele ser "npm_default".
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_default}

volumes:
  crm-db-data:
  crm-redis-data:
  crm-media:
